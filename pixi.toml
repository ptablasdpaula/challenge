[workspace]
name = "dafx-taskb-cnf"
version = "0.1.0"
description = "DAFx Task B: Modal parameter estimation via equivariant flow matching"
channels = ["pytorch", "nvidia", "conda-forge"]
platforms = ["linux-64"]   # Apocrita is linux-64; add "osx-arm64" if needed locally

[dependencies]
python = "3.11.*"
pytorch = {version = "2.4.*", channel = "pytorch"}
pytorch-cuda = {version = "12.4.*", channel = "pytorch"}
torchvision = {version = "*", channel = "pytorch"}
numpy = ">=1.26"
scipy = ">=1.12"
pandas = ">=2.0"
tqdm = ">=4.0"
lightning = ">=2.2"
einops = ">=0.7"

[pypi-dependencies]
soundfile = ">=0.12"
wandb = ">=0.17"
causal-conv1d = ">=1.2.0,<1.4.0"
mamba-ssm = ">=1.2.0,<2.0"

[feature.cpu]
# CPU-only feature for local development without CUDA (e.g. MacBook)
# Usage: pixi install --feature cpu
# Note: mamba-ssm is NOT available here — use --model deepsets locally
platforms = ["osx-arm64", "linux-64"]

[feature.cpu.dependencies]
pytorch = {version = ">=2.3.0", channel = "pytorch"}
cpuonly = {version = "*", channel = "pytorch"}

[feature.cpu.pypi-dependencies]
# no mamba-ssm on CPU

[environments]
default = {features = [], solve-group = "cuda"}
cpu = {features = ["cpu"], solve-group = "cpu", no-default-feature = true}

[tasks]
# Overfit sanity check (2 samples, Mamba, full sequence length)
overfit = {cmd = """
python train.py \
  --data_folder $DATA_FOLDER \
  --model mamba \
  --batch_size 2 \
  --n_samples 4 \
  --overfit \
  --max_epochs 2000 \
  --val_every 200 \
  --d_model 256 --d_ff 512 --n_layers 8 --d_cond 256 \
  --d_state 32 \
  --num_workers 4
"""}

# Full training run
train = {cmd = """
python train.py \
  --data_folder $DATA_FOLDER \
  --model mamba \
  --batch_size 4 \
  --max_modes 0 \
  --n_fft 8192 \
  --d_model 512 --d_ff 1024 --n_layers 12 --d_cond 256 \
  --d_state 32 \
  --lr 1e-4 \
  --warmup_steps 2000 \
  --max_epochs 500 \
  --num_workers 8 \
  --wandb \
  --run_name mamba-full
"""}

# DeepSets local test (no CUDA needed)
train-local = {cmd = """
python train.py \
  --data_folder $DATA_FOLDER \
  --model deepsets \
  --batch_size 1 \
  --max_modes 0 \
  --d_model 512 --d_ff 1024 --n_layers 12 --d_cond 256 \
  --lr 1e-4 \
  --max_epochs 5000 \
  --val_every 500 \
  --num_workers 0 \
  --overfit --n_samples 2
"""}

# Smoke test
smoke = {cmd = "python smoke_test.py --data_folder $DATA_FOLDER"}